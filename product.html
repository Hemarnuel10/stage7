<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="styles/style.css">
    <script src="./js/index.js" defer></script>
    <script src="./js/productDetails.js" defer></script>

    <title>home</title>
</head>
<body>
    <main>
        <section class="px-4 md:px-10 bg-[#F2F2F7] grid grid-cols-1 md:grid-cols-7 self-center gap-10 pb-16">
            <div class="col-span-4 product-image">
                
            </div>

            <div class="col-span-3 product-details">
                
            </div>
        </section>

        <section class="px-4 py-6 md:px-10">
            <div>
                <div class="flex gap-4 py-4">
                    <p class="text-xl font-bold">Description</p>
                    <p class="text-xl font-bold">Specs</p>
                    <p class="text-xl font-bold">Reviews</p>
                </div>

                <p class="text-[12px] text-[#555555]">Elevate your everyday wardrobe with our Premium heavyweight cotton hoodie. Designed for an ultra-relaxed, comfortable oversized drape that doesn't lose structure over time. Double-layered hood, no drawstrings, dropped shoulders.</p>
            </div>
        </section>

        <section class="px-4 py-6 md:px-10">
            <span class="text-[#9C6D53] text-xs font-bold">COORDINATED STYLYING</span>
            <h2 class="text-2xl font-extrabold pb-5">Complete Your Look</h2>
            <div class="featured-product grid grid-cols-1 gap-5">
                
            </div>
        </section>
    </main>
