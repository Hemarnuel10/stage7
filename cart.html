<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="styles/style.css">
    <title>home</title>
</head>
<body class="">
    <main class="bg-[#F9F9FB] py-3 flex flex-col md:flex-row justify-between px-4 md:px-10 lg:px-30 gap-8 lg:gap-18">
        <div class="md:grow">
            <div class="flex justify-between">
                <h2 class="font-extrabold text-2xl">Your Cart</h2>
                <p>(2 Items)</p>
            </div>
            <hr class="my-5">
            <section class="flex flex-col gap-4">
                <div class="flex bg-[white] justify-between border border-[#EAEAEA] rounded-xl p-3">
                    <div class="flex gap-3">
                        <img src="./assets/cart-Rectangle.jpg" alt="">
                        <div>
                            <span class="text-[10px] font-semibold text-[#8E8E93]">Outerwear</span>
                            <h3 class="text-[14px] font-bold">Essential Hoodie</h3>
                            <p class="text-[11px]">Black | M</p>
                            <p class="text-[14px] font-extrabold">$65.00</p>
                        </div>
                    </div>
                    <div class="flex flex-col gap-6">
                        <button class="self-end">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"></circle>
                                <line x1="15" y1="9" x2="9" y2="15"></line>
                                <line x1="9" y1="9" x2="15" y2="15"></line>
                            </svg>
                        </button>
                        <div class="inline-flex text-[11px] items-center gap-4 border border-[#EAEAEA] rounded-xl px-4 py-2">
                            <button type="button" class="text-gray-400 font-bold">-</button>
                            <span class="font-semibold">1</span>
                            <button type="button" class="text-gray-800 font-bold">+</button>
                        </div>
                    </div>
                </div>

                <div class="flex bg-white justify-between border border-[#EAEAEA] rounded-xl p-3">
                    <div class="flex gap-3">
                        <img src="./assets/cart-Rectangle.jpg" alt="">
                        <div>
                            <span class="text-[10px] font-semibold text-[#8E8E93]">Outerwear</span>
                            <h3 class="text-[14px] font-bold">Essential Hoodie</h3>
                            <p class="text-[11px]">Black | M</p>
                            <p class="text-[14px] font-extrabold">$65.00</p>
                        </div>
                    </div>
                    <div class="flex flex-col gap-6">
                        <button class="self-end">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"></circle>
                                <line x1="15" y1="9" x2="9" y2="15"></line>
                                <line x1="9" y1="9" x2="15" y2="15"></line>
                            </svg>
                        </button>
                        <div class="inline-flex text-[11px] items-center gap-4 border border-[#EAEAEA] rounded-xl px-4 py-2">
                            <button type="button" class="text-gray-400 font-bold">-</button>
                            <span class="font-semibold">1</span>
                            <button type="button" class="text-gray-800 font-bold">+</button>
                        </div>
                    </div>
                </div>
            </section>

            <div class="py-4 px-2">
                <a class="font-semibold text-xs underline">Continue Shopping</a>
            </div>
        </div>

        <aside class="border border-[#EAEAEA] px-4 mt-4 rounded-2xl">
            <h3 class="font-extrabold text-md py-5">Order Summary</h3>
            <div class="flex flex-col gap-3">
                <p class="flex justify-between text-[13px]">Subtotal <span class="font-semibold">$155.00</span></p>
                <p class="flex justify-between text-[13px]">Shipping <span class="font-semibold">$10.00</span></p>
                <p class="flex justify-between text-[13px] text-emerald-500">Discount <span class="font-semibold">-$15.00</span></p>
                <hr>
                <p class="flex justify-between  text-[15px] font-extrabold">Total <span class="font-extrabold">$150.00</span></p>
            </div>

            <div class="flex gap-4 items-center py-5">
                <input type="text" id=""
                   placeholder="Enter promo code" 
                   class="grow bg-[#F9F9FB] py-3 border border-[#8E8E93] rounded-lg px-3 text-xs text-[#8E8E93]">
            
            <button type="button" class="border-2 px-4 py-2 text-[13px] font-bold border-black rounded-lg">Apply</button>

            </div>
            <button type="submit" class="bg-[#9C6D53] py-4 rounded-xl text-white text-[13px] font-bold w-full">Proceed to Checkout</button>



            <p class="flex justify-center items-center py-5 gap-[10px] text-[#8E8E93]">
                <svg xmlns="http://w3.org" viewBox="0 0 40 40" width="24" height="24" style="flex-shrink: 0;">
                    <defs>
                    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#EAEAEA" />
                        <stop offset="100%" stop-color="#8E8E93" />
                    </linearGradient>
                    </defs>

                    <!-- Shield & Lock Icon Group -->
                    <g transform="translate(0, 3)">
                    <!-- Shield Background -->
                    <path d="M20 0 L36 5 C36 18 28 29 20 34 C12 29 4 18 4 5 Z" fill="url(#shieldGrad)" />
                    <!-- Padlock Body -->
                    <rect x="13" y="14" width="14" height="11" rx="2" fill="#8E8E93" />
                    <!-- Padlock Shackle -->
                    <path d="M16 14 V10 C16 8 24 8 24 10 V14" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" />
                    <!-- Keyhole -->
                    <circle cx="20" cy="18" r="1.5" fill="white" />
                    <path d="M19.5 19.5 H20.5 V22 H19.5 Z" fill="white" />
                    </g>
                </svg>
                <span class="text-[13px]">Secure 256-bit SSL encrypted checkout</span>
                </p>

        </aside>
    </main>    
</body>
</html>
