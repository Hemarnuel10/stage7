<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="styles/style.css">
    <script src="./js/index.js" defer></script>
    <script src="./js/shop.js" defer></script>
    <title>home</title>
</head>
<body class="bg-white">
    <header class="px-4 py-4 md:px-10 lg:px-30">

        <div class="flex items-center justify-between">
            <p class="font-extrabold text-2xl text-black">VĒRA</p>

            <nav class="hidden md:flex items-center gap-10 lg:gap-20">

                <ul class="flex items-center gap-10">
                    <li><a href="./home.html">Home</a></li>
                    <li><a href="./shop.html">Shop</a></li>
                    <li><a href="./about.html">About</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                </ul>

                <div class="flex items-center gap-4">

                    <input type="search" placeholder="Search" class="w-40 rounded-full bg-[#EAEAEA] px-5 py-3 outline-none">

                    <a href="./cart.html" aria-label="Shopping cart" class="cart-icon flex">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="cart-count font-semibold text-xs text-black"></span>
                    </a>

                </div>

            </nav>

            <button id="menu-btn" class="md:hidden">

                <svg
                    id="menu-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>

                <svg
                    id="close-icon"
                    class="hidden"
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>

            </button>

        </div>


        <!-- Mobile Navigation -->
        <div id="mobile-menu" class="hidden md:hidden mt-6 border-t border-gray-200 pt-5">

            <ul class="flex flex-col gap-5">

                <li><a href="">Home</a></li>
                <li><a href="">Shop</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Contact</a></li>

                <li><input type="search" placeholder="Search" class="w-full rounded-full bg-[#EAEAEA] px-4 py-3 outline-none"></li>

                <li>
                    <a href="" class="flex items-center gap-2">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>

                        <span>Cart</span>

                    </a>
                </li>

            </ul>

        </div>

    </header>

    <main class="px-4 py-10 md:px-10 lg:px-30">
        <div class="flex items-center justify-between flex-wrap gap-3 pb-2">
            <div>
                <span class="text-[#9C6D53] text-xs font-bold">FULL CATALOG</span>
                <h1 class="text-2xl font-extrabold">Shop All</h1>
            </div>
            <p class="shop-result-count text-xs text-[#8E8E93]"></p>
        </div>

        <div class="category-filters flex gap-2 overflow-x-auto py-5" role="group" aria-label="Filter by category"></div>

        <div class="shop-grid grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4"></div>
    </main>
</body>
</html>
